<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>CPR 状态</title>
  <style>
:root {
  --bg: #f5f6fa; --panel: #ffffff; --text: #1c1e26; --muted: #6b7280;
  --accent: #e2231a; --accent2: #f5e642; --border: #d9dbe3; --input-bg: #ffffff;
  --chip: #eef0f5; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
}
[data-theme="dark"] {
  --bg: #12141c; --panel: #1b1e2b; --text: #e8eaf2; --muted: #9aa1b2;
  --accent: #ff4b3e; --accent2: #f5e642; --border: #2c3040; --input-bg: #232739;
  --chip: #262b3d; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
body { padding: 8px; }
h1, h2, h3 { margin: 6px 0; font-size: 14px; }
button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.small { padding: 2px 7px; font-size: 11.5px; border-radius: 6px; }
input, select, textarea { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; width: 100%; }
.row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.hpbar { height: 10px; border-radius: 6px; background: var(--chip); overflow: hidden; }
.hpbar > div { height: 100%; background: var(--ok); }
.muted { color: var(--muted); font-size: 12px; }
.result-box { background: var(--chip); border-radius: 8px; padding: 8px; margin-top: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <script src="app.js"></script>
</body>
</html>
